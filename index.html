<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>BGMマップ（固定版）</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>BGMマップエディタ</h1>

<div id="container">
  <img id="map" src="assets/map.jpg">
  <canvas id="canvas" width="800" height="500"></canvas>
  <div id="dot"></div>
</div>

<div>
  <button id="areaBtn">エリア作成</button>
  <button id="areaFinishBtn">エリア確定</button>
  <input type="file" id="bgmInput">

  <br>

  <button id="routeBtn">ルート作成</button>
  <button id="playBtn">再生</button>

  <br>

  <button id="saveBtn">保存</button>
  <button id="loadBtn">読み込み</button>
  <button id="resetBtn">リセット</button>
</div>

<audio id="audio"></audio>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
